apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO(aluno): troque cicd-dev pelo seu projeto de desenvolvimento ($DEV_NS) aqui e em "newName".
namespace: luz-dev

resources:
  - ../../base

# As linhas "newName", "digest" e "APP_VERSION" sao reescritas pelo pipeline (task update-config).
# Nao altere o formato delas: o pipeline as localiza por padrao de texto.
images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/luz-dev/luz-bairro
    digest: sha256:c69020e49009c1ef1c2fd836eb754d9cd221e05b1b1ce3329ab1b14510e3f6ad

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - APP_VERSION=45a2455
