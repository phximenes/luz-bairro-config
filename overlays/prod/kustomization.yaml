apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cicd-prod-phximenes

resources:
  - ../../base

images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/cicd-dev-phximenes/luz-bairro
    digest: sha256:3443e463314fefeb0e0c8e799a88a57860e85bdafb9f54ede1d8f216abe5e950

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_MESSAGE=Portal Luz do Bairro - PRODUCAO
      - APP_ENV=prod
      - APP_VERSION=05d7c6d

patches:
  - target:
      kind: Deployment
      name: luz-bairro
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
