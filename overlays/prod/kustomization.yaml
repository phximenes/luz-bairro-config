apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cicd-prod-phximenes

resources:
  - ../../base

images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/cicd-dev-phximenes/luz-bairro
    digest: sha256:a934bdab0ebb98954a40a492aac7633b3f9596645adc972f84d636f80019e51f

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_MESSAGE=Portal Luz do Bairro - PRODUCAO
      - APP_ENV=prod
      - APP_VERSION=c10dac5

patches:
  - target:
      kind: Deployment
      name: luz-bairro
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
