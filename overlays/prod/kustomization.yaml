apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cicd-prod-phximenes

resources:
  - ../../base

images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/cicd-dev-phximenes/luz-bairro
    digest: sha256:85627b813bbe19b019470818ea5c0b3f4e1286f9f001c38a903d340eaada6099

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_MESSAGE=Portal Luz do Bairro - PRODUCAO
      - APP_ENV=prod
      - APP_VERSION=2f8c779

patches:
  - target:
      kind: Deployment
      name: luz-bairro
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
